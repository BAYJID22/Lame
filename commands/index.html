<!DOCTYPE html>
<html lang="en" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LAME — 450+ Commands</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- FontAwesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="/commands/commands.css">
</head>
<body class="bg-[#090A0F] text-slate-100 min-h-screen flex flex-col justify-between items-center font-sans antialiased">

    <!-- ================= SINGLE UNIFIED HEADER ================= -->
    <header class="w-full bg-[#0b0c10]/90 backdrop-blur-md border-b border-white/5 sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-6 h-20 flex items-center justify-between">
            
            <!-- LOGO + VERSION -->
            <a href="/home/index.html" class="flex items-center gap-3 text-white text-decoration-none">
                <div class="relative w-9 h-9 bg-[#5865F2] rounded-xl flex items-center justify-center text-lg text-white">
                    <i class="fa-brands fa-discord"></i>
                    <span class="absolute -bottom-0.5 -right-0.5 w-3 h-3 bg-emerald-500 rounded-full border-2 border-[#0b0c10]"></span>
                </div>
                <div>
                    <span class="text-xl font-bold tracking-wide text-white flex items-center gap-2">
                        LAME <span class="text-[10px] bg-white/10 text-gray-300 font-mono px-2 py-0.5 rounded border border-white/15">v4.2</span>
                    </span>
                </div>
            </a>

            <!-- NAV LINKS -->
            <nav class="hidden md:flex items-center gap-8 text-sm font-medium text-gray-400">
                <a href="/home/index.html" class="hover:text-white transition">Home</a>
                <a href="/commands/index.html" class="text-white font-bold flex items-center gap-1.5">
                    Commands 
                    <span class="bg-white/10 text-white text-xs px-2 py-0.5 rounded-full">450+</span>
                </a>
                <a href="/dashboard/index.html" class="hover:text-white transition">Dashboard</a>
                <a href="/team/index.html" class="hover:text-white transition">Team</a>
            </nav>

            <!-- DISCORD LOGIN BUTTON -->
            <a href="https://discord.com/oauth2/authorize?client_id=1550784546331697194&permissions=8&integration_type=0&scope=bot" target="_blank" class="bg-white text-black text-sm font-bold px-5 py-2.5 rounded-xl flex items-center gap-2 hover:bg-gray-200 transition shadow-lg shadow-white/5">
                <i class="fa-brands fa-discord text-lg"></i>
                <span>Login with Discord</span>
            </a>

        </div>
    </header>

    <!-- COMMAND EXPLORER CONTENT -->
    <main class="py-12 px-6 max-w-7xl mx-auto w-full flex-grow space-y-8">
        <div class="text-center max-w-3xl mx-auto space-y-3">
            <h1 class="text-4xl font-extrabold text-white">450+ Command Explorer</h1>
            <p class="text-gray-400">Search and filter through the complete toolkit of bot Lame.</p>

            <!-- SEARCH BAR -->
            <div class="relative max-w-xl mx-auto mt-6">
                <i class="fa-solid fa-magnifying-glass absolute left-4 top-4 text-gray-400"></i>
                <input type="text" id="cmdSearch" onkeyup="filterCommands()" placeholder="Search commands by name or description..." class="w-full bg-[#12141D] border border-white/15 rounded-xl pl-12 pr-4 py-3 text-white placeholder-gray-500 focus:outline-none focus:border-white transition">
            </div>
        </div>

        <!-- COMMAND CARDS GRID -->
        <div id="commandsGrid" class="grid md:grid-cols-2 lg:grid-cols-3 gap-4"></div>
    </main>

    <!-- ================= SINGLE UNIFORM FOOTER ================= -->
    <footer class="w-full py-4 border-t border-white/5 text-center text-xs text-gray-400 font-medium bg-[#0b0c10]/40 mt-auto">
        <p>LAME Anti-Nuke Bot &copy; All Rights Reserved. Created by <span class="text-white font-bold">Flame</span> &amp; <span class="text-white font-bold">Shadow</span></p>
    </footer>

    <script src="/commands/commands.js"></script>
</body>
</html>
